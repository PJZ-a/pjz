name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg

      - name: Generate OG PNG
        run: python tools/generate_og_png.py

      - name: Prepare site folder
        run: |
          rm -rf site || true
          mkdir site
          # replace placeholders in index.html with actual repo info and switch to PNG
          sed "s|<你的用户名>|${{ github.repository_owner }}|g; s|<仓库名>|${{ github.event.repository.name }}|g; s|assets/og-banner.svg|assets/og-banner.png|g" index.html > site/index.html
          cp styles.css README.md 简历.docx .nojekyll site/ || true
          mkdir -p site/assets
          cp -r assets/* site/assets/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
